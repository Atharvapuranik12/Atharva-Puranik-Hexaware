<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Student Management</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(to right, #ff7e5f, #feb47b); 
            color: white; /* The Heading that I have given is in white colour  */
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
        }
        table {
            margin-top: 20px;
            background-color: rgba(255, 255, 255, 0.9); /* Semi-transparent white background for the table */
            color: black; /* Text color for the table */
        }
        button {
            margin: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Student Management System</h1>

    <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" class="form-control" id="name">
        
        <label for="age">Age:</label>
        <input type="number" class="form-control" id="age">
        
        <label for="grade">Grade:</label>
        <input type="text" class="form-control" id="grade">
        
        <button class="btn btn-primary" onclick="addStudent()">Add</button>
    </div>

    <div>
        <button class="btn btn-secondary" onclick="viewStudents()">View</button>
        <button class="btn btn-info" onclick="sortStudents()">Sort by Grade</button>
    </div>

    <table class="table table-bordered" id="studentTable">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Grade</th>
            <th>Action</th>
        </tr>
    </table>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.2/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- Link to the external JavaScript file -->
<script src="student.js"></script>

</body>
</html>
