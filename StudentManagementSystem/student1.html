<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-KyZXEAg3QhqLMpG8r+Knujsl5+5hb7U4/s24l6JXBdcy/J5kjjLw5gu4aTwVKcJ7" crossorigin="anonymous">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff7e5f, #feb47b);
            color: rgb(130, 22, 22);
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #output {
            white-space: pre-wrap;
            background-color: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            color: rgb(141, 50, 50);
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            border: none;
            background-color: #ff6f61;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            margin: 10px;
        }

        button:hover {
            background-color: #e65b54;
        }
    </style>
</head>

<body>

    <div class="container text-center">
        <h1 class="mb-4">Student Management System</h1>
        <button id="startButton" class="btn btn-lg" onclick="startProgram()">Start Program</button>
        <div id="output" class="mt-4"></div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" integrity="sha384-kQtW33rZJAHjgefvhyyzcGFusSOeR6z9Ff8e6iCtmDDWh9baOfth7gB4wL4OHK5Q" crossorigin="anonymous"></script>

    <!-- Custom JS -->
    <script src="student1.js"></script>

</body>

</html>
